name: Monorepo QA Pipeline

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files and build dynamic matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
             CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          else
             CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          # Extracts the 'projects/folder_name' correctly
          PROJECTS=$(echo "$CHANGED_FILES" | grep '^projects/' | cut -d'/' -f1,2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          
          echo "Changed projects: $PROJECTS"
          echo "matrix=$PROJECTS" >> $GITHUB_OUTPUT

  qa-checks:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Core Dependencies & QA Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: 1. Compile Python Bytecode
        run: |
          python -m compileall ${{ matrix.project }} -q

      - name: 2. Run Ruff Linter
        run: |
          ruff check ${{ matrix.project }}
          ruff format --check ${{ matrix.project }}

      - name: 3. Run MyPy Type Checker
        run: |
          mypy ${{ matrix.project }} --ignore-missing-imports

      - name: 4. Run Pytest Unit Tests
        run: |
          if ls ${{ matrix.project }}/tests/*.py 1> /dev/null 2>&1; then
            pytest -q --tb=short --disable-warnings --maxfail=1 ${{ matrix.project }}/tests/
          else
            echo "No tests found in ${{ matrix.project }}, skipping pytest."
          fi
